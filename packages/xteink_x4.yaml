###############################################################################
# Xteink X4 — Sprout Track baby dashboard
# https://github.com/Boisti13/xteink-x4-esphome
#
# Everything Home Assistant needs for the display lives in this one package.
# It polls the Sprout Track API and turns the answers into display-ready
# sensors; the device reads them (esphome/xteink_x4_modules/text_sensors.yaml).
#
# Needs in /config/secrets.yaml (see README → Install):
#   sprout_track_auth:           "Bearer st_live_…"
#   sprout_track_status_url:     "http://<host>:3000/api/hooks/v1/babies/<baby-id>/status"
#   sprout_track_medicine_url:   "…/babies/<baby-id>/activities?type=medicine&limit=20"
#   sprout_track_supplement_url: "…/babies/<baby-id>/activities?type=supplement&limit=20"
#   sprout_track_medicines_url:  "…/babies/<baby-id>/reference?type=medicines"
#     (the medicine list with each one's minimum time between doses,
#     doseMinTime; needs a Sprout Track version whose hooks API returns it)
###############################################################################

###############################################################################
# Raw data from Sprout Track (every minute)
###############################################################################
rest:
  - resource: !secret sprout_track_status_url
    headers:
      Authorization: !secret sprout_track_auth
    scan_interval: 60
    sensor:
      - name: "Xteink X4 Sprout Status"
        unique_id: xteink_x4_sprout_status
        icon: mdi:baby-face-outline
        value_template: "{{ value_json.meta.timestamp }}"
        json_attributes_path: "$.data"
        json_attributes:
          - baby
          - lastActivities
          - dailyCounts

  - resource: !secret sprout_track_medicine_url
    headers:
      Authorization: !secret sprout_track_auth
    scan_interval: 60
    sensor:
      - name: "Xteink X4 Sprout Medicine"
        unique_id: xteink_x4_sprout_medicine
        icon: mdi:pill
        value_template: "{{ value_json.data.count }}"
        json_attributes_path: "$.data"
        json_attributes:
          - activities

  # The medicines themselves, for their minimum time between doses
  # (doseMinTime, "DD:HH:MM"). Rarely changes: every 10 minutes.
  - resource: !secret sprout_track_medicines_url
    headers:
      Authorization: !secret sprout_track_auth
    scan_interval: 600
    sensor:
      - name: "Xteink X4 Sprout Medicines"
        unique_id: xteink_x4_sprout_medicines
        icon: mdi:medical-bag
        value_template: "{{ value_json.data.medicines | count }}"
        json_attributes_path: "$.data"
        json_attributes:
          - medicines

  - resource: !secret sprout_track_supplement_url
    headers:
      Authorization: !secret sprout_track_auth
    scan_interval: 60
    sensor:
      - name: "Xteink X4 Sprout Supplements"
        unique_id: xteink_x4_sprout_supplements
        icon: mdi:eyedropper
        value_template: "{{ value_json.data.count }}"
        json_attributes_path: "$.data"
        json_attributes:
          - activities

###############################################################################
# Keep the display awake (for OTA updates and testing), screen orientation,
# wake mode
###############################################################################
input_boolean:
  xteink_x4_keep_awake:
    name: Xteink X4 Keep awake
    icon: mdi:sleep-off

  # On = landscape (two columns), off = portrait (one column); read by the
  # X4 on every wake
  xteink_x4_landscape:
    name: Xteink X4 Landscape
    icon: mdi:phone-rotate-landscape

# How the X4 sleeps, read on every wake:
#   Hourly       wake every full hour (not at night)
#   Button only  no hourly wakes, deep sleep until the power button
#   Power off    battery cut until the power button switches it back on:
#                draws nothing while off (on USB it sleeps like Button only)
input_select:
  xteink_x4_wake_mode:
    name: Xteink X4 Wake mode
    icon: mdi:power-sleep
    options:
      - Hourly
      - Button only
      - Power off

###############################################################################
# Display-ready values. Times are local, durations H:MM.
# Counts and lists cover today since midnight.
###############################################################################
template:
  - sensor:
      # "Arthur · Wed, 7 Oct"
      - name: "Xteink X4 Header"
        unique_id: xteink_x4_header
        icon: mdi:calendar-today
        state: >
          {% set baby = state_attr('sensor.xteink_x4_sprout_status', 'baby') or {} %}
          {% set name = baby.get('firstName', '') %}
          {{ (name ~ ' · ' if name else '') ~ now().strftime('%a, %-d %b') }}

      # Outside temperature for the header, e.g. "16.5°" — to know how to
      # dress the baby. Point it at your own outdoor sensor.
      - name: "Xteink X4 Outdoor"
        unique_id: xteink_x4_outdoor
        icon: mdi:thermometer
        availability: "{{ has_value('sensor.virtual_outdoor_temperature') }}"
        state: >
          {{ '%.1f°' | format(states('sensor.virtual_outdoor_temperature') | float) }}

      # State: time awake (or asleep) as H:MM. Attributes: label, since.
      - name: "Xteink X4 Sleep"
        unique_id: xteink_x4_sleep
        icon: mdi:sleep
        availability: "{{ has_value('sensor.xteink_x4_sprout_status') }}"
        state: >
          {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
          {% set s = last.get('sleep') %}
          {% set t = (s.startTime if s.isActive else s.endTime) if s else none %}
          {% if t %}
            {% set mins = ((now() - as_datetime(t)).total_seconds() // 60) | int %}
            {{ '%d:%02d' | format(mins // 60, mins % 60) }}
          {% else %}
            –
          {% endif %}
        attributes:
          label: >
            {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
            {% set s = last.get('sleep') %}
            {{ 'Asleep for' if s and s.isActive else 'Awake for' }}
          since: >
            {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
            {% set s = last.get('sleep') %}
            {% set t = (s.startTime if s.isActive else s.endTime) if s else none %}
            {{ (as_datetime(t) | as_local).strftime('%H:%M') if t else '' }}

      # State: time since the last diaper as H:MM.
      # Attributes: time, type, wet and dirty today (BOTH counts in both).
      - name: "Xteink X4 Diaper"
        unique_id: xteink_x4_diaper
        icon: mdi:human-baby-changing-table
        availability: "{{ has_value('sensor.xteink_x4_sprout_status') }}"
        state: >
          {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
          {% set d = last.get('diaper') %}
          {% if d %}
            {% set mins = ((now() - as_datetime(d.time)).total_seconds() // 60) | int %}
            {{ '%d:%02d' | format(mins // 60, mins % 60) }}
          {% else %}
            –
          {% endif %}
        attributes:
          time: >
            {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
            {% set d = last.get('diaper') %}
            {{ (as_datetime(d.time) | as_local).strftime('%H:%M') if d else '' }}
          type: >
            {% set last = state_attr('sensor.xteink_x4_sprout_status', 'lastActivities') or {} %}
            {% set d = last.get('diaper') %}
            {{ {'WET': 'wet', 'DIRTY': 'dirty', 'BOTH': 'wet + dirty'}.get(d.type, '') if d else '' }}
          wet: >
            {% set c = (state_attr('sensor.xteink_x4_sprout_status', 'dailyCounts') or {}).get('diapersByType', {}) %}
            {{ c.get('WET', 0) + c.get('BOTH', 0) }}
          dirty: >
            {% set c = (state_attr('sensor.xteink_x4_sprout_status', 'dailyCounts') or {}).get('diapersByType', {}) %}
            {{ c.get('DIRTY', 0) + c.get('BOTH', 0) }}

      # State: doses today (since midnight). Attribute lines: one per
      # medicine given in the last 24 hours, its latest dose, newest first:
      # "HH:MM|name|next" — next is when the next dose is allowed (HH:MM),
      # "now" once that time has passed, or empty for medicines without a
      # minimum time between doses in Sprout Track.
      - name: "Xteink X4 Medicine"
        unique_id: xteink_x4_medicine
        icon: mdi:pill
        availability: "{{ has_value('sensor.xteink_x4_sprout_medicine') }}"
        state: >
          {% set acts = state_attr('sensor.xteink_x4_sprout_medicine', 'activities') or [] %}
          {{ acts | selectattr('time', 'defined')
                  | map(attribute='time') | map('as_datetime') | map('as_local')
                  | select('ge', today_at()) | list | count }}
        attributes:
          lines: >
            {% set acts = state_attr('sensor.xteink_x4_sprout_medicine', 'activities') or [] %}
            {% set meds = state_attr('sensor.xteink_x4_sprout_medicines', 'medicines') or [] %}
            {% set ns = namespace(lines=[], seen=[]) %}
            {% for a in acts | selectattr('time', 'defined') | sort(attribute='time', reverse=true)
                 if (as_datetime(a.time) | as_local) >= now() - timedelta(hours=24) %}
              {% set name = a.details.medicineName %}
              {% if name not in ns.seen %}
                {% set ns.seen = ns.seen + [name] %}
                {% set t = as_datetime(a.time) | as_local %}
                {% set gap = (meds | selectattr('name', 'eq', name) | map(attribute='doseMinTime') | first) or '' %}
                {% set p = gap.split(':') | map('int', 0) | list %}
                {% set mins = (p[0] * 1440 + p[1] * 60 + p[2]) if p | count == 3 else 0 %}
                {% set next = '' %}
                {% if mins > 0 %}
                  {% set at = t + timedelta(minutes=mins) %}
                  {% set next = 'now' if at <= now() else at.strftime('%H:%M') %}
                {% endif %}
                {% set ns.lines = ns.lines + [t.strftime('%H:%M') ~ '|' ~ name ~ '|' ~ next] %}
              {% endif %}
            {% endfor %}
            {{ ns.lines | join('\n') }}

      - name: "Xteink X4 Supplements"
        unique_id: xteink_x4_supplements
        icon: mdi:eyedropper
        availability: "{{ has_value('sensor.xteink_x4_sprout_supplements') }}"
        state: >
          {% set acts = state_attr('sensor.xteink_x4_sprout_supplements', 'activities') or [] %}
          {{ acts | selectattr('time', 'defined')
                  | map(attribute='time') | map('as_datetime') | map('as_local')
                  | select('ge', today_at()) | list | count }}
        attributes:
          lines: >
            {% set acts = state_attr('sensor.xteink_x4_sprout_supplements', 'activities') or [] %}
            {% set ns = namespace(lines=[]) %}
            {% for a in acts if (as_datetime(a.time) | as_local) >= today_at() %}
              {% set d = a.details %}
              {% set u = (d.unitAbbr or '') | lower %}
              {% if d.doseAmount != 1 and u in ['pill', 'drop'] %}{% set u = u ~ 's' %}{% endif %}
              {% set ns.lines = ns.lines + [(as_datetime(a.time) | as_local).strftime('%H:%M') ~ '|' ~ d.supplementName ~ '|' ~ (d.doseAmount | string) ~ ' ' ~ u] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
