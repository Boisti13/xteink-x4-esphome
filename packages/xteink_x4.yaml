###############################################################################
# Xteink X4 — Sprout Track baby dashboard
# https://github.com/Boisti13/xteink-x4-esphome
#
# Everything Home Assistant needs for the display lives in this one package.
# It turns the entities of the Sprout Track integration into display-ready
# sensors; the device reads them (esphome/xteink_x4_modules/text_sensors.yaml).
#
# Needs the Sprout Track integration for Home Assistant, v0.2.0 or newer
# (https://github.com/Boisti13/ha-sprout-track, see README → Install).
# The dashboard shows the integration's first baby; with several babies,
# put the name in `pick` in "Xteink X4 Baby" below.
###############################################################################

###############################################################################
# Keep the display awake (for OTA updates and testing), screen orientation,
# wake mode
###############################################################################
input_boolean:
  xteink_x4_keep_awake:
    name: Xteink X4 Keep awake
    icon: mdi:sleep-off

  # On = landscape (two columns), off = portrait (one column); read by the
  # X4 on every wake
  xteink_x4_landscape:
    name: Xteink X4 Landscape
    icon: mdi:phone-rotate-landscape

# How the X4 sleeps, read on every wake:
#   Hourly       wake every full hour (not at night)
#   Button only  no hourly wakes, deep sleep until the power button
#   Power off    battery cut until the power button switches it back on:
#                draws nothing while off (on USB it sleeps like Button only)
input_select:
  xteink_x4_wake_mode:
    name: Xteink X4 Wake mode
    icon: mdi:power-sleep
    options:
      - Hourly
      - Button only
      - Power off

###############################################################################
# Display-ready values. Times are local, durations H:MM.
# Counts and lists cover today since midnight.
###############################################################################
template:
  - sensor:
      # Which baby: the start of its entity IDs ("emma" for
      # sensor.emma_last_diaper). The integration's first baby, or the one
      # named in `pick` (e.g. {% set pick = 'Emma' %}).
      - name: "Xteink X4 Baby"
        unique_id: xteink_x4_baby
        icon: mdi:baby-face-outline
        availability: >
          {{ integration_entities('sprout_track')
             | select('match', 'sensor\\..+_last_diaper$') | list | count > 0 }}
        state: >
          {% set pick = '' %}
          {% set ids = integration_entities('sprout_track')
                       | select('match', 'sensor\\..+_last_diaper$') | sort | list %}
          {% if pick %}
            {% set ids = ids | select('match', 'sensor\\.' ~ (pick | slugify) ~ '_last_diaper$') | list %}
          {% endif %}
          {{ ids[0][7:-12] if ids else '' }}

      # "Emma · Wed, 7 Oct"
      - name: "Xteink X4 Header"
        unique_id: xteink_x4_header
        icon: mdi:calendar-today
        state: >
          {% set b = states('sensor.xteink_x4_baby') %}
          {% set dev = device_id('sensor.' ~ b ~ '_last_diaper') if has_value('sensor.xteink_x4_baby') else none %}
          {% set name = (device_attr(dev, 'name_by_user') or device_attr(dev, 'name')) if dev else '' %}
          {{ (name ~ ' · ' if name else '') ~ now().strftime('%a, %-d %b') }}

      # Outside temperature for the header, e.g. "16.5°" — to know how to
      # dress the baby. Point it at your own outdoor sensor.
      - name: "Xteink X4 Outdoor"
        unique_id: xteink_x4_outdoor
        icon: mdi:thermometer
        availability: "{{ has_value('sensor.virtual_outdoor_temperature') }}"
        state: >
          {{ '%.1f°' | format(states('sensor.virtual_outdoor_temperature') | float) }}

      # State: time awake (or asleep) as H:MM. Attributes: label, since.
      - name: "Xteink X4 Sleep"
        unique_id: xteink_x4_sleep
        icon: mdi:sleep
        availability: "{{ has_value('sensor.xteink_x4_baby') }}"
        state: >
          {% set b = states('sensor.xteink_x4_baby') %}
          {% set asleep = is_state('binary_sensor.' ~ b ~ '_sleeping', 'on') %}
          {% set t = states('sensor.' ~ b ~ ('_asleep_since' if asleep else '_awake_since')) | as_datetime %}
          {% if t %}
            {% set mins = ((now() - t).total_seconds() // 60) | int %}
            {{ '%d:%02d' | format(mins // 60, mins % 60) }}
          {% else %}
            –
          {% endif %}
        attributes:
          label: >
            {{ 'Asleep for' if is_state('binary_sensor.' ~ states('sensor.xteink_x4_baby') ~ '_sleeping', 'on') else 'Awake for' }}
          since: >
            {% set b = states('sensor.xteink_x4_baby') %}
            {% set asleep = is_state('binary_sensor.' ~ b ~ '_sleeping', 'on') %}
            {% set t = states('sensor.' ~ b ~ ('_asleep_since' if asleep else '_awake_since')) | as_datetime %}
            {{ (t | as_local).strftime('%H:%M') if t else '' }}

      # State: time since the last diaper as H:MM.
      # Attributes: time, type, wet and dirty today (wet-and-dirty counts in both).
      - name: "Xteink X4 Diaper"
        unique_id: xteink_x4_diaper
        icon: mdi:human-baby-changing-table
        availability: "{{ has_value('sensor.xteink_x4_baby') }}"
        state: >
          {% set t = states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_last_diaper') | as_datetime %}
          {% if t %}
            {% set mins = ((now() - t).total_seconds() // 60) | int %}
            {{ '%d:%02d' | format(mins // 60, mins % 60) }}
          {% else %}
            –
          {% endif %}
        attributes:
          time: >
            {% set t = states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_last_diaper') | as_datetime %}
            {{ (t | as_local).strftime('%H:%M') if t else '' }}
          type: >
            {% set d = state_attr('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_last_diaper', 'diaper_type') %}
            {{ {'WET': 'wet', 'DIRTY': 'dirty', 'BOTH': 'wet + dirty'}.get(d, '') }}
          wet: "{{ states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_wet_diapers_today') | int(0) }}"
          dirty: "{{ states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_dirty_diapers_today') | int(0) }}"

      # State: doses today (since midnight). Attribute lines: one per
      # medicine given in the last 24 hours, its latest dose, newest first:
      # "HH:MM|name|next" — next is when the next dose is allowed (HH:MM),
      # "now" once that time has passed, or empty for medicines without a
      # minimum time between doses in Sprout Track.
      - name: "Xteink X4 Medicine"
        unique_id: xteink_x4_medicine
        icon: mdi:pill
        availability: "{{ has_value('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_medicines_today') }}"
        state: "{{ states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_medicines_today') | int(0) }}"
        attributes:
          lines: >
            {% set latest = state_attr('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_medicines_today', 'latest') or [] %}
            {% set ns = namespace(lines=[]) %}
            {% for d in latest %}
              {% set next = '' %}
              {% if d.next_dose %}
                {% set at = as_datetime(d.next_dose) %}
                {% set next = 'now' if at <= now() else (at | as_local).strftime('%H:%M') %}
              {% endif %}
              {% set ns.lines = ns.lines + [(as_datetime(d.time) | as_local).strftime('%H:%M') ~ '|' ~ d.name ~ '|' ~ next] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}

      # State: doses today. Attribute lines: every dose since midnight,
      # newest first: "HH:MM|name|amount unit".
      - name: "Xteink X4 Supplements"
        unique_id: xteink_x4_supplements
        icon: mdi:eyedropper
        availability: "{{ has_value('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_supplements_today') }}"
        state: "{{ states('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_supplements_today') | int(0) }}"
        attributes:
          lines: >
            {% set doses = state_attr('sensor.' ~ states('sensor.xteink_x4_baby') ~ '_supplements_today', 'doses') or [] %}
            {% set ns = namespace(lines=[]) %}
            {% for d in doses %}
              {% set u = (d.unit or '') | lower %}
              {% if d.amount != 1 and u in ['pill', 'drop'] %}{% set u = u ~ 's' %}{% endif %}
              {% set ns.lines = ns.lines + [(as_datetime(d.time) | as_local).strftime('%H:%M') ~ '|' ~ d.name ~ '|' ~ (d.amount | string) ~ ' ' ~ u] %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
