# Copy to secrets.yaml (in the ESPHome config dir) and fill in.
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
ap_password: "fallback-ap-password"
# Public dummy key so `esphome config` runs; generate your own: openssl rand -base64 32
xteink_x4_key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
xteink_x4_ota_password: "ota-password"
# Fixed address for the X4 (also reserve it on your router)
xteink_x4_ip: "192.168.1.60"
xteink_x4_gateway: "192.168.1.1"
xteink_x4_subnet: "255.255.255.0"
