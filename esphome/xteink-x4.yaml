# Xteink X4 — ESPHome e-paper display for Home Assistant
# https://github.com/Boisti13/xteink-x4-esphome
#
# Copy this file, secrets.yaml, xteink_x4_partitions.csv and xteink_x4_modules/
# into your ESPHome config dir (in Home Assistant: /homeassistant/esphome/).
# The Home Assistant side is packages/xteink_x4.yaml.

substitutions:
  name: xteink-x4
  friendly_name: Xteink X4
  # How often the page is redrawn on its own (HA changes also redraw it)
  refresh_interval: 5min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: boisti13.xteink-x4-esphome
    version: "0.1.0"
  # The display driver includes <SPI.h> from the Arduino core
  libraries:
    - SPI
  # The X4 has 16 MB flash; the app partitions start at 0x10000
  platformio_options:
    board_upload.maximum_size: "16777216"
    board_upload.offset_address: "0x10000"

esp32:
  variant: esp32c3
  flash_size: 16MB
  partitions: xteink_x4_partitions.csv
  framework:
    type: arduino

# Display, button and battery drivers for the X4 (pinned to a known commit).
external_components:
  - source: github://ngxson/esphome-component-xteink@fe4aba7a1d3f882ec078dffdcdea5ba5efa03c60
    components: [xteink_edp, xteink_battery, xteink_input]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret xteink_x4_key

ota:
  - platform: esphome
    password: !secret xteink_x4_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin

packages:
  fonts: !include xteink_x4_modules/fonts.yaml
  sensors: !include xteink_x4_modules/sensors.yaml
  text_sensors: !include xteink_x4_modules/text_sensors.yaml
  binary_sensors: !include xteink_x4_modules/binary_sensors.yaml
  display: !include xteink_x4_modules/display.yaml
