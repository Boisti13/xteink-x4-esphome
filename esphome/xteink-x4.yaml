# Xteink X4 — Sprout Track baby dashboard on e-paper
# https://github.com/Boisti13/xteink-x4-esphome
#
# Copy this file, xteink_x4_partitions.csv and xteink_x4_modules/ into your
# ESPHome config dir (in Home Assistant: /homeassistant/esphome/) and add the
# keys from secrets.example.yaml to your ESPHome secrets.yaml.
# The Home Assistant side is packages/xteink_x4.yaml.
#
# Wake cycle: wake on the full hour (or the power button), connect, wait for
# the values from Home Assistant, draw the page once, go back to deep sleep.
# input_boolean.xteink_x4_keep_awake in Home Assistant keeps it awake for OTA.

substitutions:
  name: xteink-x4
  friendly_name: Xteink X4

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: boisti13.xteink-x4-esphome
    version: "0.2.0-dev"
  # The display driver includes <SPI.h> from the Arduino core
  libraries:
    - SPI
  includes:
    - xteink_x4_modules/power.h
  on_boot:
    priority: -100
    then:
      # After flashing or a reset: show a setup screen and wait up to
      # 10 minutes, long enough to add the device to Home Assistant.
      # After a wake from deep sleep: wait 30 s.
      - if:
          condition:
            lambda: "return xteink_cold_boot();"
          then:
            - globals.set:
                id: setup_screen
                value: "true"
            - component.update: epaper_display
            - wait_until:
                condition:
                  api.connected:
                timeout: 10min
            - globals.set:
                id: setup_screen
                value: "false"
          else:
            - wait_until:
                condition:
                  api.connected:
                timeout: 30s
      # Without Home Assistant keep the last picture instead of drawing dashes
      - if:
          condition:
            api.connected:
          then:
            - wait_until:
                condition:
                  lambda: |-
                    return id(ha_sleep).has_state() && id(ha_diaper).has_state() &&
                           id(ha_medicine).has_state() && id(ha_supplements).has_state();
                timeout: 10s
            - delay: 1s
            - component.update: epaper_display
          else:
            - logger.log:
                level: WARN
                format: "No connection to Home Assistant, keeping the old picture"
      - delay: 2s
      - script.execute: go_to_sleep

esp32:
  variant: esp32c3
  flash_size: 16MB
  partitions: xteink_x4_partitions.csv
  framework:
    type: arduino

# Display, button and battery drivers for the X4 (pinned to a known commit).
external_components:
  - source: github://ngxson/esphome-component-xteink@fe4aba7a1d3f882ec078dffdcdea5ba5efa03c60
    components: [xteink_edp, xteink_battery, xteink_input]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret xteink_x4_key

ota:
  - platform: esphome
    password: !secret xteink_x4_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Each wake is short: count a boot as good after 10 s, not the default
# minute, or repeated short wakes end in safe mode.
safe_mode:
  boot_is_good_after: 10s

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin

deep_sleep:
  id: deep_sleep_ctrl
  # Fallback; go_to_sleep sleeps until the next full hour
  sleep_duration: 60min
  # Power button (active low) wakes it at once
  wakeup_pin:
    number: GPIO3
    inverted: true

globals:
  # true while the "waiting for Home Assistant" screen is shown
  - id: setup_screen
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: keep_awake
          then:
            - logger.log: "Keep awake is on, staying awake"
          else:
            - lambda: xteink_hold_power_latch();
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: !lambda "return xteink_ms_to_next_hour(id(ha_time).now());"

packages:
  fonts: !include xteink_x4_modules/fonts.yaml
  images: !include xteink_x4_modules/images.yaml
  sensors: !include xteink_x4_modules/sensors.yaml
  text_sensors: !include xteink_x4_modules/text_sensors.yaml
  binary_sensors: !include xteink_x4_modules/binary_sensors.yaml
  display: !include xteink_x4_modules/display.yaml
