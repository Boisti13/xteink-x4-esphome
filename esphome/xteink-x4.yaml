# Xteink X4 — Sprout Track baby dashboard on e-paper
# https://github.com/Boisti13/xteink-x4-esphome
#
# Copy this file, xteink_x4_partitions.csv and xteink_x4_modules/ into your
# ESPHome config dir (in Home Assistant: /homeassistant/esphome/) and add the
# keys from secrets.example.yaml to your ESPHome secrets.yaml.
# The Home Assistant side is packages/xteink_x4.yaml.
#
# Wake cycle: wake on the full hour, except 23:00–6:00 (or on the power button), connect, wait for
# the values from Home Assistant, draw the page once, go back to deep sleep.
# input_boolean.xteink_x4_keep_awake in Home Assistant keeps it awake for OTA.

substitutions:
  name: xteink-x4
  friendly_name: Xteink X4
  # No wakes from quiet_start:00 until quiet_end:00 (local time); the power
  # button still wakes it. Same value twice = wake every hour, day and night.
  quiet_start: "23"
  quiet_end: "6"
  # At or below this battery level (%) the footer turns into a black
  # "please charge" bar
  battery_warning: "15"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: boisti13.xteink-x4-esphome
    version: "0.2.0"
  # The display driver includes <SPI.h> from the Arduino core
  libraries:
    - SPI
  includes:
    - xteink_x4_modules/power.h
  on_boot:
    priority: -100
    then:
      # After flashing or a reset: show a setup screen and wait up to
      # 10 minutes, long enough to add the device to Home Assistant.
      # After a wake from deep sleep: wait 30 s.
      - if:
          condition:
            lambda: "return xteink_cold_boot();"
          then:
            - globals.set:
                id: setup_screen
                value: "true"
            - component.update: epaper_display
            - wait_until:
                condition:
                  api.connected:
                timeout: 10min
            - globals.set:
                id: setup_screen
                value: "false"
          else:
            - wait_until:
                condition:
                  api.connected:
                timeout: 30s
      - lambda: "id(connected_ms) = millis();"
      # Without Home Assistant keep the last picture instead of drawing dashes
      - if:
          condition:
            api.connected:
          then:
            - wait_until:
                condition:
                  lambda: |-
                    return id(ha_sleep).has_state() && id(ha_diaper).has_state() &&
                           id(ha_medicine).has_state() && id(ha_supplements).has_state();
                timeout: 10s
            # Attributes arrive in the same burst as the states
            - delay: 200ms
            # Blocks until the panel has finished refreshing
            - component.update: epaper_display
          else:
            - logger.log:
                level: WARN
                format: "No connection to Home Assistant, keeping the old picture"
      - script.execute: go_to_sleep

esp32:
  variant: esp32c3
  flash_size: 16MB
  partitions: xteink_x4_partitions.csv
  framework:
    type: arduino

# Display, button and battery drivers for the X4 (pinned to a known commit).
external_components:
  - source: github://ngxson/esphome-component-xteink@fe4aba7a1d3f882ec078dffdcdea5ba5efa03c60
    components: [xteink_edp, xteink_battery, xteink_input]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret xteink_x4_key

ota:
  - platform: esphome
    password: !secret xteink_x4_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # A fixed address skips DHCP on every wake (reserve it on the router too)
  manual_ip:
    static_ip: !secret xteink_x4_ip
    gateway: !secret xteink_x4_gateway
    subnet: !secret xteink_x4_subnet
    dns1: !secret xteink_x4_gateway
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Each wake is short: count a boot as good after 10 s, not the default
# minute, or repeated short wakes end in safe mode.
safe_mode:
  boot_is_good_after: 10s

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Berlin

deep_sleep:
  id: deep_sleep_ctrl
  # Fallback; go_to_sleep sleeps until the next full hour outside the quiet hours
  sleep_duration: 60min
  # Power button (active low) wakes it at once
  wakeup_pin:
    number: GPIO3
    inverted: true

globals:
  # true while the "waiting for Home Assistant" screen is shown
  - id: setup_screen
    type: bool
    restore_value: no
    initial_value: "false"
  # millis() when Home Assistant had connected (or gave up), for the
  # "Wake: connected after" sensor
  - id: connected_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: keep_awake
          then:
            - logger.log: "Keep awake is on, staying awake"
          else:
            # Report how long this wake took, then give the API a moment to
            # send it
            - sensor.template.publish:
                id: wake_connected
                state: !lambda "return id(connected_ms) / 1000.0f;"
            - sensor.template.publish:
                id: wake_total
                state: !lambda "return millis() / 1000.0f;"
            - delay: 300ms
            - lambda: xteink_hold_power_latch();
            - deep_sleep.enter:
                id: deep_sleep_ctrl
                sleep_duration: !lambda "return xteink_ms_to_next_wake(id(ha_time).now(), ${quiet_start}, ${quiet_end});"

packages:
  fonts: !include xteink_x4_modules/fonts.yaml
  images: !include xteink_x4_modules/images.yaml
  sensors: !include xteink_x4_modules/sensors.yaml
  text_sensors: !include xteink_x4_modules/text_sensors.yaml
  binary_sensors: !include xteink_x4_modules/binary_sensors.yaml
  switches: !include xteink_x4_modules/switches.yaml
  display: !include xteink_x4_modules/display.yaml
