# Buttons. The four front buttons are 1–4 (a resistor ladder on GPIO1),
# the side buttons up/down (GPIO2), power on GPIO3.
binary_sensor:
  - platform: xteink_input
    button_1:
      id: btn_1
      name: "Button 1"
    button_2:
      id: btn_2
      name: "Button 2"
    button_3:
      id: btn_3
      name: "Button 3"
    button_4:
      id: btn_4
      name: "Button 4"
    button_up:
      id: btn_up
      name: "Button up"
    button_down:
      id: btn_down
      name: "Button down"
    button_pwr:
      id: btn_pwr
      name: "Power button"
      # While awake, a short press redraws the page
      on_click:
        - component.update: epaper_display

  # USB plugged in (GPIO20 is high while USB powers the X4, as CrossPoint
  # reads it). Below 100 % that means charging.
  - platform: gpio
    id: usb_power
    name: "USB power"
    device_class: plug
    entity_category: diagnostic
    pin:
      number: GPIO20
      mode: INPUT

  # input_boolean.xteink_x4_keep_awake: on = stay awake (OTA, testing).
  # Turning it off sends the device back to sleep.
  - platform: homeassistant
    id: keep_awake
    entity_id: input_boolean.xteink_x4_keep_awake
    # on_state skips the initial state, so this only fires on a real switch-off
    on_state:
      - if:
          condition:
            lambda: "return !x;"
          then:
            - script.execute: go_to_sleep
