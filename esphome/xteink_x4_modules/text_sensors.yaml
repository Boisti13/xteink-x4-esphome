# Display-ready values from packages/xteink_x4.yaml in Home Assistant.
text_sensor:
  - platform: homeassistant
    id: ha_header
    entity_id: sensor.xteink_x4_header

  # Outside temperature, "16.5°"
  - platform: homeassistant
    id: ha_outdoor
    entity_id: sensor.xteink_x4_outdoor

  # Sleep: H:MM, "Awake for"/"Asleep for", since HH:MM
  - platform: homeassistant
    id: ha_sleep
    entity_id: sensor.xteink_x4_sleep
  - platform: homeassistant
    id: ha_sleep_label
    entity_id: sensor.xteink_x4_sleep
    attribute: label
  - platform: homeassistant
    id: ha_sleep_since
    entity_id: sensor.xteink_x4_sleep
    attribute: since

  # Diaper: H:MM since the last one, its time and type, wet/dirty today
  - platform: homeassistant
    id: ha_diaper
    entity_id: sensor.xteink_x4_diaper
  - platform: homeassistant
    id: ha_diaper_time
    entity_id: sensor.xteink_x4_diaper
    attribute: time
  - platform: homeassistant
    id: ha_diaper_type
    entity_id: sensor.xteink_x4_diaper
    attribute: type
  - platform: homeassistant
    id: ha_diaper_wet
    entity_id: sensor.xteink_x4_diaper
    attribute: wet
  - platform: homeassistant
    id: ha_diaper_dirty
    entity_id: sensor.xteink_x4_diaper
    attribute: dirty

  # Medicine and supplements: count today, lines "HH:MM|name|dose"
  - platform: homeassistant
    id: ha_medicine
    entity_id: sensor.xteink_x4_medicine
  - platform: homeassistant
    id: ha_medicine_lines
    entity_id: sensor.xteink_x4_medicine
    attribute: lines
  - platform: homeassistant
    id: ha_supplements
    entity_id: sensor.xteink_x4_supplements
  - platform: homeassistant
    id: ha_supplements_lines
    entity_id: sensor.xteink_x4_supplements
    attribute: lines

  # What the microSD card answered when it was put into its low-power idle
  # before the last sleep: "idle", "no card" or "no answer"
  - platform: template
    id: sd_card
    name: "SD card"
    entity_category: diagnostic
    icon: mdi:micro-sd
    update_interval: never

  # input_select.xteink_x4_wake_mode: Hourly, Button only (deep sleep until
  # the power button) or Power off (battery cut until the power button).
  # Read on every wake, takes effect at the next sleep. Switched while the
  # X4 is awake, the footer is redrawn to match.
  - platform: homeassistant
    id: wake_mode
    entity_id: input_select.xteink_x4_wake_mode
    on_value:
      - lambda: "id(wake_mode_select).publish_state(x);"
      - if:
          condition:
            lambda: "return !id(setup_screen);"
          then:
            - component.update: epaper_display
