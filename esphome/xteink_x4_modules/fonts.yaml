# GF_Latin_Core covers umlauts and typographic punctuation (·, –) in names.
font:
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 64
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: font_title
    size: 32
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: font_label
    size: 24
    glyphsets: [GF_Latin_Core]
  # Medicine / Supplements headings in landscape, larger than their entries
  - file: "gfonts://Roboto@700"
    id: font_section
    size: 28
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_body
    size: 26
    glyphsets: [GF_Latin_Core]
  # Medicine and supplement entries in landscape
  - file: "gfonts://Roboto"
    id: font_list
    size: 23
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
    glyphsets: [GF_Latin_Core]
